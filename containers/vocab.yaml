# Mount generated SUMO vocabulary from project-owned state, read-only.
# These files are intentionally ignored by Git and absent from the checkout.
services:
  research:
    volumes:
      - type: bind
        source: ${NL2LOGIC_STATE:?Set NL2LOGIC_STATE}/vocab/sumo_classes.jsonl
        target: /workspace/data/training_pairs/sumo_classes.jsonl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NL2LOGIC_STATE:?Set NL2LOGIC_STATE}/vocab/sumo_relations.jsonl
        target: /workspace/data/training_pairs/sumo_relations.jsonl
        read_only: true
        bind:
          create_host_path: false
